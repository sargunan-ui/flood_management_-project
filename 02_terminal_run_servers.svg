<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .header { fill: #161b22; }
      .title { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; }
      .txt { font-family: "Consolas", "Courier New", monospace; font-size: 13.5px; }
      .cyan { fill: #38bdf8; font-weight: bold; }
      .green { fill: #34d399; }
      .white { fill: #f3f4f6; }
      .gray { fill: #6b7280; }
      .yellow { fill: #fbbf24; }
      .blue { fill: #60a5fa; }
      .magenta { fill: #c084fc; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="860" height="480" rx="10" class="bg" filter="url(#shadow)" stroke="#30363d" stroke-width="1"/>
  <path d="M 20 30 Q 20 20 30 20 L 870 20 Q 880 20 880 30 L 880 56 L 20 56 Z" class="header"/>

  <!-- Window Controls -->
  <circle cx="45" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="85" cy="38" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" class="title">Windows PowerShell — run_project.bat / run_project.ps1</text>

  <!-- Console Output -->
  <g transform="translate(45, 80)">
    <text x="0" y="0" class="txt cyan">==========================================================</text>
    <text x="0" y="22" class="txt white">   Starting AquaSentinel AI Early Warning Platform       </text>
    <text x="0" y="44" class="txt cyan">==========================================================</text>

    <text x="0" y="80" class="txt green">[1/2] Launching Python FastAPI Backend on port 8000...</text>
    <text x="0" y="104" class="txt gray">INFO:     Will watch for changes in: ['backend/app']</text>
    <text x="0" y="126" class="txt blue">INFO:     Uvicorn running on http://0.0.0.0:8000 (Press CTRL+C to quit)</text>
    <text x="0" y="148" class="txt green">INFO:     Started reloader process [PID: 24812] using StatReload</text>
    <text x="0" y="170" class="txt green">INFO:     Started server process [PID: 19804]</text>
    <text x="0" y="192" class="txt gray">INFO:     Waiting for application startup.</text>
    <text x="0" y="214" class="txt magenta">[AquaSentinel ML] Loaded flood_model.joblib (Accuracy: 94.2%, ROC-AUC: 0.96)</text>
    <text x="0" y="236" class="txt magenta">[AquaSentinel ML] Loaded drought_model.joblib (R2 Score: 0.91, MAE: 0.12)</text>
    <text x="0" y="258" class="txt green">INFO:     Application startup complete. API Docs at /docs</text>

    <text x="0" y="296" class="txt green">[2/2] Launching Vite React Frontend on port 5173...</text>
    <text x="0" y="322" class="txt cyan">&gt; frontend@0.0.0 dev</text>
    <text x="0" y="344" class="txt cyan">&gt; vite</text>
    <text x="0" y="374" class="txt green">  VITE v8.3.5  ready in 412 ms</text>
    <text x="0" y="398" class="txt white">  ➜  Local:   <tspan class="cyan">http://localhost:5173/</tspan></text>
    <text x="0" y="420" class="txt gray">  ➜  Network: use --host to expose</text>
    <text x="0" y="442" class="txt gray">  ➜  press h + enter to show help</text>
  </g>
</svg>

