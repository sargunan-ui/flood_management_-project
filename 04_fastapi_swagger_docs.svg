<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <style>
      .browser-bar { fill: #f1f3f5; }
      .browser-input { fill: #ffffff; stroke: #dee2e6; font-family: -apple-system, sans-serif; font-size: 13px; fill: #495057; }
      .swagger-bg { fill: #fafafa; }
      .swagger-head { fill: #1b1b1b; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #3b4151; font-size: 24px; }
      .txt-badge { fill: #7d8492; font-family: monospace; font-size: 12px; }
      .txt-sub { font-family: -apple-system, sans-serif; font-size: 13px; fill: #555e70; }
      .tag-header { font-family: -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #3b4151; }
      .pill-get { fill: #61affe; }
      .pill-post { fill: #49cc90; }
      .row-get { fill: #ebf3fb; stroke: #61affe; }
      .row-post { fill: #e8f6f0; stroke: #49cc90; }
      .ep-method { font-family: -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
      .ep-path { font-family: monospace; font-weight: 600; font-size: 13.5px; fill: #3b4151; }
      .ep-desc { font-family: -apple-system, sans-serif; font-size: 12.5px; fill: #555e70; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="20" width="860" height="520" rx="10" class="swagger-bg" filter="url(#shadow)" stroke="#ced4da" stroke-width="1"/>
  <path d="M 20 30 Q 20 20 30 20 L 870 20 Q 880 20 880 30 L 880 62 L 20 62 Z" class="browser-bar"/>

  <!-- Controls -->
  <circle cx="45" cy="41" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="41" r="6" fill="#ffbd2e"/>
  <circle cx="85" cy="41" r="6" fill="#27c93f"/>

  <!-- URL Bar -->
  <rect x="120" y="28" width="620" height="26" rx="13" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="140" y="45" class="browser-input">🔒 http://localhost:8000/docs — Swagger UI</text>

  <!-- Top Brand Banner -->
  <rect x="20" y="62" width="860" height="38" class="swagger-head"/>
  <text x="45" y="86" fill="#49cc90" font-family="sans-serif" font-weight="bold" font-size="16px">swagger</text>
  <text x="110" y="86" fill="#ffffff" font-family="sans-serif" font-size="12px">supported by SmartBear</text>

  <!-- Swagger Title -->
  <g transform="translate(45, 130)">
    <text x="0" y="0" class="txt-title">AquaSentinel AI API</text>
    <rect x="250" y="-18" width="165" height="22" rx="11" fill="#7d8492" opacity="0.2"/>
    <text x="260" y="-3" class="txt-badge">1.0.0-hackathon-release</text>
    <text x="0" y="24" class="txt-sub">AI-Powered Flood &amp; Drought Early Warning and Climate Resilience Platform</text>
    <text x="0" y="44" class="txt-sub" fill="#61affe">[ /openapi.json ] • OAS 3.1.0</text>
  </g>

  <!-- Endpoints Section -->
  <g transform="translate(45, 215)">
    <!-- GET /api/health -->
    <rect x="0" y="0" width="810" height="42" rx="4" class="row-get" stroke-width="1"/>
    <rect x="10" y="8" width="60" height="26" rx="3" class="pill-get"/>
    <text x="40" y="25" text-anchor="middle" class="ep-method">GET</text>
    <text x="85" y="26" class="ep-path">/api/health</text>
    <text x="210" y="26" class="ep-desc">System health check &amp; ML model readiness status</text>

    <!-- GET /api/dashboard -->
    <rect x="0" y="52" width="810" height="42" rx="4" class="row-get" stroke-width="1"/>
    <rect x="10" y="60" width="60" height="26" rx="3" class="pill-get"/>
    <text x="40" y="77" text-anchor="middle" class="ep-method">GET</text>
    <text x="85" y="78" class="ep-path">/api/dashboard</text>
    <text x="230" y="78" class="ep-desc">National KPI metrics, threat distribution, and risk hotspots</text>

    <!-- POST /api/predict/flood -->
    <rect x="0" y="104" width="810" height="42" rx="4" class="row-post" stroke-width="1"/>
    <rect x="10" y="112" width="60" height="26" rx="3" class="pill-post"/>
    <text x="40" y="129" text-anchor="middle" class="ep-method">POST</text>
    <text x="85" y="130" class="ep-path">/api/predict/flood</text>
    <text x="250" y="130" class="ep-desc">Execute Random Forest flood inference + TreeSHAP explainability</text>

    <!-- POST /api/predict/drought -->
    <rect x="0" y="156" width="810" height="42" rx="4" class="row-post" stroke-width="1"/>
    <rect x="10" y="164" width="60" height="26" rx="3" class="pill-post"/>
    <text x="40" y="181" text-anchor="middle" class="ep-method">POST</text>
    <text x="85" y="182" class="ep-path">/api/predict/drought</text>
    <text x="265" y="182" class="ep-desc">Execute Gradient Boosting drought deficit inference + crop advice</text>

    <!-- GET /api/rivers -->
    <rect x="0" y="208" width="810" height="42" rx="4" class="row-get" stroke-width="1"/>
    <rect x="10" y="216" width="60" height="26" rx="3" class="pill-get"/>
    <text x="40" y="233" text-anchor="middle" class="ep-method">GET</text>
    <text x="85" y="234" class="ep-path">/api/rivers</text>
    <text x="205" y="234" class="ep-desc">Real-time CWC river telemetry &amp; flood warning thresholds</text>

    <!-- GET /api/alerts -->
    <rect x="0" y="260" width="810" height="42" rx="4" class="row-get" stroke-width="1"/>
    <rect x="10" y="268" width="60" height="26" rx="3" class="pill-get"/>
    <text x="40" y="285" text-anchor="middle" class="ep-method">GET</text>
    <text x="85" y="286" class="ep-path">/api/alerts</text>
    <text x="200" y="286" class="ep-desc">Active CAP multi-hazard broadcasts &amp; emergency notifications</text>
  </g>
</svg>

